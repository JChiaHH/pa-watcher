name: offline-ping
# Every 5 min (GitHub's minimum; it may start late under load). Public repo = free, unlimited Actions minutes.
# Pings the owner; tells the sender it's offline. Run it by hand: Actions -> offline-ping -> Run workflow.
# Logs are public: the script prints only "ok: ..." (no names, counts or ids).
on:
  schedule:
    - cron: "2-59/5 * * * *"  # off the hour mark, when GitHub is busiest
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-ping
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore what was already reported
        uses: actions/cache/restore@v4
        with:
          path: state
          key: reported-${{ github.run_id }}
          restore-keys: reported-
      - name: Check for messages waiting while the laptop is off
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python3 offline_ping.py
      - name: Remember it
        if: steps.check.outputs.changed == '1'
        uses: actions/cache/save@v4
        with:
          path: state
          key: reported-${{ github.run_id }}
